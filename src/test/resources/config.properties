# ========================================================
# E-COMMERCE TEST AUTOMATION FRAMEWORK CONFIGURATION
# ========================================================

# Browser: chrome, edge, firefox
browser=chrome

# Run in headless mode: true / false
headless=false

# Timeouts in seconds
timeout.explicit=10
timeout.pageload=30

# Target E-Commerce Application URLs
local.app.url=http://localhost:3000
saucedemo.url=https://www.saucedemo.com
automationexercise.url=https://automationexercise.com

# Extent Reports settings
report.title=E-Commerce Automation Test Report
report.name=Regression & E2E Test Execution
report.theme=DARK
