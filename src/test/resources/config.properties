# Browser: chrome, edge, firefox
browser=chrome

# Run in headless mode: true / false
headless=false

# Timeouts in seconds
timeout.explicit=10
timeout.pageload=30

# Target Application URLs (Astro Dev Server: port 4321)
app.url=http://localhost:4321
admin.url=http://localhost:4321/admin
local.app.url=http://localhost:4321

# Extent Reports settings
report.title=Nội Thất E-Commerce Automation Test Report
report.name=Admin & Storefront Regression Test Execution
report.theme=DARK
