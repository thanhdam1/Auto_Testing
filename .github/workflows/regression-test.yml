name: E-Commerce Automated Regression Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Selenium E2E Tests (Headless)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run Test Suite
        run: ./mvnw clean test "-DsuiteFile=testng.xml" "-Dheadless=true"

      - name: Upload ExtentReports Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-reports
          path: reports/
          retention-days: 14
