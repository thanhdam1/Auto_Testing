name: E-Commerce Automated Regression Tests

on:
  # Đã tắt tự động chạy khi push/pull_request theo yêu cầu vì hệ thống web đang chạy local
  # CI chỉ chạy khi người dùng chủ động bấm "Run workflow" trên GitHub Actions
  workflow_dispatch:
    inputs:
      suiteFile:
        description: 'File test suite TestNG cần chạy'
        required: true
        default: 'testng.xml'
        type: choice
        options:
          - testng.xml
          - testng-all.xml
          - testng-smoke.xml
          - testng-api.xml
          - testng-novashop.xml
          - testng-repair.xml
          - testng-noithatbang.xml
      headless:
        description: 'Chạy ở chế độ Headless (không mở cửa sổ trình duyệt)'
        required: true
        default: true
        type: boolean

jobs:
  test:
    name: Run Selenium E2E Tests (Headless)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run Test Suite
        run: ./mvnw clean test "-DsuiteFile=${{ github.event.inputs.suiteFile || 'testng.xml' }}" "-Dheadless=${{ github.event.inputs.headless || 'true' }}"

      - name: Upload ExtentReports Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-reports
          path: reports/
          retention-days: 14

      - name: Upload Surefire Reports and System Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-and-logs
          path: |
            target/surefire-reports/
            logs/
          retention-days: 14

      - name: Verify Surefire Results (CI Quality Gate)
        if: always()
        run: python3 scripts/verify_surefire_results.py target/surefire-reports/testng-results.xml
